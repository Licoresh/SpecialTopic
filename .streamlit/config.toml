[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
maxUploadSize = 500

[theme]
base = "light"
primaryColor = "#2F6B5D"
greenColor = "#2F6B5D"
greenBackgroundColor = "#E8F4EE"
greenTextColor = "#245D4E"
blueColor = "#3568A0"
blueBackgroundColor = "#EDF4FD"
blueTextColor = "#285A8C"
orangeColor = "#A65A24"
orangeBackgroundColor = "#FFF3E8"
orangeTextColor = "#8F481C"
violetColor = "#7150A8"
violetBackgroundColor = "#F2EDFA"
violetTextColor = "#5A3B8D"
redColor = "#A7444D"
redBackgroundColor = "#FCEFF0"
redTextColor = "#903A43"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FA"
textColor = "#172B3A"
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.65rem", "1.25rem", "1.1rem", "1rem", ".9rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
borderColor = "#E0E7EF"
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#EEF5F3"
dataframeHeaderTextColor = "#29443F"
chartCategoricalColors = ["#2F6B5D", "#3568A0", "#A65A24", "#7150A8", "#A7444D", "#527983", "#716B45"]
chartSequentialColors = ["#F1F8F6", "#E1F0EC", "#CAE5DE", "#A9D4C9", "#83BFB0", "#5BA593", "#378A77", "#1D705F", "#11584B", "#0B4037"]

[theme.sidebar]
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#E9F0ED"
