[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
maxUploadSize = 500

[theme]
base = "light"
primaryColor = "#78182B"
greenColor = "#19765C"
greenBackgroundColor = "#EAF4EF"
greenTextColor = "#155D4B"
blueColor = "#326A9C"
blueBackgroundColor = "#EEF4FA"
blueTextColor = "#285A80"
orangeColor = "#A66A17"
orangeBackgroundColor = "#FBF3E1"
orangeTextColor = "#85520F"
violetColor = "#A8751C"
violetBackgroundColor = "#FBF3E1"
violetTextColor = "#805713"
redColor = "#BD384A"
redBackgroundColor = "#FBEDEF"
redTextColor = "#962D3B"
backgroundColor = "#FBF8F4"
secondaryBackgroundColor = "#F6F5F3"
textColor = "#24303D"
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.65rem", "1.25rem", "1.1rem", "1rem", ".9rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
borderColor = "#E5E3E0"
